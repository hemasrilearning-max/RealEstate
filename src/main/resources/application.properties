# =========================================================
# APPLICATION
# =========================================================

spring.application.name=real-estate-app
server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/realestate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# JWT
# =========================================================

app.jwt.secret=YourSuperSecretKeyForRealEstateAppMustBeAtLeast256BitsLongForHS256Algorithm
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000


# =========================================================
# BROKER COMMISSION
# =========================================================

app.broker.commission-percentage=2.00


# =========================================================
# GMAIL SMTP
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=realestate.application12@gmail.com
spring.mail.password=hvqftlmlyqmgezhe

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=realestate.application12@gmail.com

app.mail.from=realestate.application12@gmail.com
app.mail.from-name=Real Estate Application


# =========================================================
# EMAIL LOGGING
# =========================================================

logging.level.org.springframework.mail=DEBUG
logging.level.org.eclipse.angus.mail=DEBUG


# =========================================================
# FILE UPLOAD / MEDIA
# =========================================================

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB


# =========================================================
# RAZORPAY - TEST MODE
# =========================================================

razorpay.key.id="your_razorpay_test_key_id" # Replace with your Razorpay Test Key ID
razorpay.key.secret="your_razorpay_test_key_secret" # Replace

# Create this secret yourself in Razorpay Test Mode
# Dashboard -> Settings -> Webhooks
razorpay.webhook.secret=YOUR_RAZORPAY_TEST_WEBHOOK_SECRET


# =========================================================
# SPRING SECURITY LOGGING
# =========================================================

logging.level.org.springframework.security=INFO


# =========================================================
# APPLICATION LOGGING
# =========================================================

logging.level.com.realestate=DEBUG